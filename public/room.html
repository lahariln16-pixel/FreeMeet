<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>FreeMeet — Meeting room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/room.css">
</head>
<body>
    <header class="room-header">
        <div class="logo"><span class="logo-dot"></span>FreeMeet</div>
        <div class="room-info"><span>Meeting code</span><strong id="roomId">------</strong><button id="copyRoom" type="button">Copy link ↗</button></div>
    </header>
    <main class="meeting">
        <section id="videoGrid" class="video-grid">
            <div class="video-card local">
                <video id="localVideo" autoplay muted playsinline></video>
                <div id="localName" class="name">You</div>
            </div>
        </section>
        <aside id="chatPanel" class="chat-panel">
            <div class="chat-header"><span>In-meeting chat</span><button id="closeChat" type="button" aria-label="Close chat">✕</button></div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area"><input id="chatInput" type="text" placeholder="Write a message…" maxlength="500" aria-label="Chat message"><button id="sendChat" type="button" aria-label="Send message">↑</button></div>
        </aside>
    </main>
    <footer class="controls">
        <button id="micButton" class="control" type="button" title="Microphone" aria-label="Toggle microphone">🎤</button>
        <button id="cameraButton" class="control" type="button" title="Camera" aria-label="Toggle camera">📹</button>
        <button id="screenButton" class="control" type="button" title="Share screen" aria-label="Share screen">▧</button>
        <button id="chatButton" class="control" type="button" title="Chat" aria-label="Toggle chat">▤</button>
        <button id="leaveButton" class="control leave" type="button" title="Leave meeting" aria-label="Leave meeting">↗</button>
    </footer>
    <script src="/room.js"></script>
</body>
</html>
